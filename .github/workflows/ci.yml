name: CI

# push auf coolify-deploy ist der Deploy-Weg (Coolify baut von diesem Branch) —
# ohne den Trigger liefe die CI faktisch nie, da PRs gegen main die Ausnahme sind.
on:
  push:
    branches: [coolify-deploy, main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Gleiche Node-Version wie die Prod-Container (node:22-bookworm-slim)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check all JS files
        run: |
          echo ">> Music Bot"
          find bots/music-bot/src -name "*.js" -exec node --check {} +
          echo ">> Soundboard Bot"
          find bots/soundboard-bot/src -name "*.js" -exec node --check {} +

      - name: Build music-bot webapp
        run: pnpm --filter discord-music-bot-app build

      - name: Build website
        run: pnpm --filter bytebots-website build
