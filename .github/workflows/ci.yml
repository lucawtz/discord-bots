name: CI

# push auf prod ist der Branch, von dem der Server baut —
# ohne den Trigger liefe die CI faktisch nie, da PRs gegen main die Ausnahme sind.
on:
  push:
    branches: [prod, main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Gleiche Node-Version wie die Prod-Container (node:22-bookworm-slim)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check all JS files
        run: |
          echo ">> Music Bot"
          find bots/music-bot/src -name "*.js" -exec node --check {} +
          echo ">> Soundboard Bot"
          find bots/soundboard-bot/src -name "*.js" -exec node --check {} +

      # Offline-Tests: echter Bot-Code gegen Fakes fuer Discord und yt-dlp.
      # Netz-Tests (Deezer) sind hier bewusst uebersprungen — CI soll nicht an
      # einer fremden API haengen. Lokal: pnpm --filter discord-music-bot test:net
      - name: Test music-bot
        run: pnpm --filter discord-music-bot test

      - name: Build music-bot webapp
        run: pnpm --filter discord-music-bot-app build

      - name: Build website
        run: pnpm --filter bytebots-website build

  # Postet neu hinzugekommene CHANGELOG.md-Eintraege nach #changelog (Discord-Webhook).
  # Nur bei push auf prod und NUR nach gruenem Build (needs) — ein Changelog
  # fuer einen kaputten Build waere schlimmer als keiner. No-op ohne das Secret
  # CHANGELOG_WEBHOOK_URL, bricht den Deploy nie (Skript endet immer mit Exit 0).
  changelog-notify:
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 -> volle History, damit github.event.before im Repo aufloesbar ist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post new CHANGELOG.md entries to Discord
        env:
          CHANGELOG_WEBHOOK_URL: ${{ secrets.CHANGELOG_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/post-changelog.js
