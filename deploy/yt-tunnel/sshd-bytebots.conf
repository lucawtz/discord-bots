# ByteBots-Server — liegt als /etc/ssh/sshd_config.d/10-bytebots.conf.
# Muss VOR 50-cloud-init.conf sortieren: bei sshd gewinnt der ERSTE gesetzte Wert,
# und cloud-init setzt dort "PasswordAuthentication yes".

# Nur noch Schluessel-Login (Root weiter erlaubt, aber nicht per Passwort).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

# Raspberry Pi (Heim-IP) darf NUR den SOCKS-Tunnel fuer YouTube oeffnen:
# kein Shell/TTY, keine lokalen Weiterleitungen, Listen nur auf docker0:1080.
Match User ytproxy
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    PermitListen 10.0.0.1:1080
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /usr/sbin/nologin
    ClientAliveInterval 30
    ClientAliveCountMax 3
Match all
