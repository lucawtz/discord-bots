# ByteBots-Prod-Stack — ersetzt Coolify seit 2026-09-13.
#
# Server-Layout:
#   /opt/bytebots/repo       Git-Checkout (Branch prod), diese Datei liegt unter deploy/
#   /opt/bytebots/env/       music-bot.env, soundboard-bot.env (chmod 600, NIE ins Repo)
#   /opt/bytebots/secrets/   cookies.txt (yt-dlp schreibt zurueck -> muss beschreibbar sein)
#
# Deploy: scripts/deploy.sh <service>   (git reset auf origin/prod + build + up)
# Logs:   ssh root@<server> 'cd /opt/bytebots/repo/deploy && docker compose logs -f music-bot'
#
# Die Service-Namen warp / pot-provider sind zugleich die DNS-Namen im Compose-Netz —
# die Code-Defaults socks5://warp:1080 und http://pot-provider:4416 greifen unveraendert.
name: bytebots

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  music-bot:
    build:
      context: ..
      dockerfile: bots/music-bot/Dockerfile
    image: bytebots/music-bot:latest
    restart: unless-stopped
    env_file: /opt/bytebots/env/music-bot.env
    environment:
      # YouTube ueber die Heim-IP: der Raspberry Pi Zero W (pi-hole, Luca zuhause) haelt
      # per ssh -R einen SOCKS-Tunnel auf 10.0.0.1:1080 (docker0) offen. WARP-Exit-IPs
      # sind fuer lizenzierte Musik gesperrt (2026-09-12). Faellt der Pi aus -> ProxyError
      # -> SoundCloud-Fallback. Zurueck auf WARP: diese Zeile entfernen (Code-Default).
      YTDLP_PROXY: socks5://host.docker.internal:1080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - music-data:/repo/bots/music-bot/data
      - /opt/bytebots/secrets/cookies.txt:/repo/bots/music-bot/cookies.txt
    depends_on:
      - warp
      - pot-provider
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s # Entrypoint aktualisiert erst yt-dlp per pip
    labels:
      - autoheal=true
    logging: *logging

  soundboard-bot:
    build:
      context: ..
      dockerfile: bots/soundboard-bot/Dockerfile
    image: bytebots/soundboard-bot:latest
    restart: unless-stopped
    env_file: /opt/bytebots/env/soundboard-bot.env
    volumes:
      - soundboard-data:/repo/bots/soundboard-bot/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    logging: *logging

  website:
    build:
      context: ..
      dockerfile: website/Dockerfile
    image: bytebots/website:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    logging: *logging

  # Cloudflare WARP als SOCKS5-Proxy (Port 1080) fuer YouTube. Das Image bringt einen
  # eigenen Healthcheck mit; autoheal startet ihn neu, falls der Daemon wieder still
  # abstuerzt (2026-08/09: 24 Tage unbemerkt tot).
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    device_cgroup_rules:
      - "c 10:200 rwm"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    labels:
      - autoheal=true
    logging: *logging

  # PO-Token-Provider (Port 4416). Auf 1.3.1 gepinnt: gegen Plugin 1.3.1 UND 2.0.0
  # getestet (2026-09-12); ein Versionssprung hier erst nach eigenem Test.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    logging: *logging

  # Startet Container mit Label autoheal=true neu, sobald Docker sie als unhealthy markiert
  # (Docker selbst tut das nicht).
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging

volumes:
  # Bestehende Coolify-Volumes weiterverwenden (keine Datenkopie, trivialer Rollback).
  music-data:
    external: true
    name: e9kxd4rv94k3vu3at3nw6o7u-music-data
  soundboard-data:
    external: true
    name: rhyrgoi2u2l1f0g7xyp6c0m7-soundboard-data
  warp-data:
  caddy-data:
  caddy-config:
